*{box-sizing:border-box;margin:0;padding:0;}
body{

}
.gc-wrap{

  border-radius:20px;padding:28px 32px;max-width:1160px;margin:0 auto;

.gc-header{margin-bottom:24px;}
.gc-header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:8px;}
.gc-title{font-size:22px;font-weight:700;color:#0f172a;letter-spacing:-0.02em;}
.gc-badge{font-size:11px;font-weight:700;padding:4px 14px;border-radius:20px;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;letter-spacing:0.05em;}
.gc-sub{font-size:13px;color:#94a3b8;line-height:1.5;}
.filter-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #f1f5f9;}
.filter-btn{
  font-size:12px;font-weight:500;padding:5px 16px;border-radius:20px;

  transition:all 0.2s ease;letter-spacing:0.01em;
}
.filter-btn.active{
  background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;border-color:transparent;
  box-shadow:0 4px 12px rgba(79,70,229,0.3);transform:translateY(-1px);
}
.filter-btn:hover:not(.active){
  background:#f8fafc;border-color:#cbd5e1;transform:translateY(-1px);
  box-shadow:0 2px 6px rgba(0,0,0,0.06);
}
.chart-area{overflow-x:auto;border-radius:10px;}
.chart-area::-webkit-scrollbar{height:6px;}
.chart-area::-webkit-scrollbar-track{background:#f8fafc;border-radius:3px;}
.chart-area::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px;}
.chart-area::-webkit-scrollbar-thumb:hover{background:#94a3b8;}
.inner{min-width:920px;}
.task-row{display:flex;align-items:center;margin-bottom:3px;border-radius:6px;padding:1px 0;transition:background 0.15s;}

.task-label{font-size:12px;color:#334155;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:10px;flex-shrink:0;transition:color 0.15s;}
.task-label.sub{color:#94a3b8;font-size:11px;padding-left:14px;}
.task-row:hover .task-label{color:#0f172a;}
.bar-cell{position:relative;height:26px;flex-shrink:0;}
.bar{
  position:absolute;top:4px;height:18px;border-radius:5px;
  display:flex;align-items:center;padding:0 7px;
  font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;cursor:default;
  transform-origin:left center;
  animation:barSlideIn 0.4s cubic-bezier(0.4,0,0.2,1) both;
  transition:filter 0.15s,box-shadow 0.15s;
}
.bar:hover{filter:brightness(1.08) saturate(1.1);box-shadow:0 4px 14px rgba(0,0,0,0.15);z-index:10;}
@keyframes barSlideIn{
  from{transform:scaleX(0.04);opacity:0;}
  to  {transform:scaleX(1);opacity:1;}
}
.bar.blue  {background:linear-gradient(90deg,#C9E0F8,#7BBCED);color:#0a3d7a;}
.bar.teal  {background:linear-gradient(90deg,#AAEBD6,#4DC9A8);color:#064e3b;}
.bar.amber {background:linear-gradient(90deg,#FCD88E,#F5A823);color:#5a3205;}
.bar.coral {background:linear-gradient(90deg,#F9D0C2,#EC9070);color:#712B13;}
.bar.purple{background:linear-gradient(90deg,#DAD7F9,#ABAAE9);color:#3C3489;}
.bar.green {background:linear-gradient(90deg,#CCDF9E,#95C84A);color:#1e400a;}
.bar.gray  {background:linear-gradient(90deg,#DEDAD3,#B8B5AA);color:#3a3a37;}
.bar.pink  {background:linear-gradient(90deg,#F7C9D9,#EE93B5);color:#72243E;}

  position:absolute;top:50%;transform:translateY(-50%) rotate(45deg);

  border-radius:3px;cursor:default;

}
.milestone:hover{box-shadow:0 4px 16px rgba(220,38,38,0.6);}
@keyframes milestoneIn{
  from{transform:translateY(-50%) rotate(45deg) scale(0);opacity:0;}
  to  {transform:translateY(-50%) rotate(45deg) scale(1);opacity:1;}

.section-label{

.section-label::after{

.month-col{

.status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;flex-shrink:0;}

function pctSpan(s,e){
  const sp = pct(s), ep = pct(e);
  return {left:sp+'%', width:Math.max(ep-sp,1.2)+'%'};
}

  {group:'avionics', section:'',      label:'基板動作確認（全班）',             sub:false, start:'2026-06-20', end:'2026-07-10', color:'pink',   status:'todo',   note:'届き次第すぐ確認'},
  {group:'avionics', section:'',      label:'地上局設計・通信試験（LoRa）',    sub:false, start:'2026-06-08', end:'2026-07-15', color:'pink',   status:'todo',   note:'担当：佐藤。審査書後スタート'},
  {group:'avionics', section:'',      label:'電装認定試験（低温・通信）',       sub:false, start:'2026-07-01', end:'2026-08-15', color:'pink',   status:'todo',   note:''},
  {group:'avionics', section:'',      label:'全体統合試験',                    sub:false, start:'2026-08-10', end:'2026-08-28', color:'pink',   status:'todo',   note:'全ミッション統合'},
];

// --- Tooltip ---
const ttEl = document.getElementById('gc-tooltip');
let hideTimer;

function showTooltip(e, t){
  clearTimeout(hideTimer);
  const period = t.milestone ? fmtDate(t.start) : `${fmtDate(t.start)} → ${fmtDate(t.end)}`;
  const noteHtml = t.note ? `<div class="tt-note">${t.note}</div>` : '';
  const progHtml = t.milestone ? '' :
    `<div class="tt-progress"><div class="tt-progress-fill" style="width:${PROGRESS[t.status]}%;background:${PROG_COLOR[t.status]};"></div></div>`;
  ttEl.innerHTML = `
    <div class="tt-title">${t.label}</div>
    <div class="tt-row"><strong>${period}</strong></div>
    ${noteHtml}
    <div class="tt-footer">
      <span class="tt-status ${t.status}">${STATUS_LABEL[t.status]}</span>
      ${progHtml}
    </div>`;
  placeTooltip(e);
  ttEl.classList.add('visible');
}

function placeTooltip(e){
  const vw = window.innerWidth, vh = window.innerHeight;
  const x = e.clientX + 16, y = e.clientY - 12;
  ttEl.style.left = Math.min(x, vw - 296) + 'px';
  ttEl.style.top  = Math.min(y, vh - 140) + 'px';
}

function hideTooltip(){ hideTimer = setTimeout(()=>ttEl.classList.remove('visible'), 80); }

// --- Render ---
let activeGroup = 'all';

function render(animate){
  const vis = activeGroup === 'all' ? tasks : tasks.filter(t=>t.group===activeGroup);
  const chart = document.getElementById('chart');
  const COL_W = LABEL_W + BAR_W;

  function build(){
    chart.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.style.cssText = `position:relative;width:${COL_W}px;`;

    // Month header
    const hdr = document.createElement('div');
    hdr.style.cssText = 'display:flex;margin-bottom:6px;';
    const lbl0 = document.createElement('div');
    lbl0.style.cssText = `width:${LABEL_W}px;flex-shrink:0;`;
    hdr.appendChild(lbl0);
    const mWrap = document.createElement('div');
    mWrap.style.cssText = `width:${BAR_W}px;display:flex;`;
    const months = ['6月','7月','8月'];
    const mS = [new Date(2026,5,1),new Date(2026,6,1),new Date(2026,7,1)];
    const mE = [new Date(2026,6,1),new Date(2026,7,1),new Date(2026,8,30)];
    months.forEach((m,i)=>{
      const d = document.createElement('div');
      d.className = 'month-col';
      d.style.width = ((mE[i]-mS[i])/86400000/TOTAL_DAYS*100)+'%';
      d.textContent = m;
      mWrap.appendChild(d);
    });
    hdr.appendChild(mWrap);
    wrap.appendChild(hdr);

    const area = document.createElement('div');
    area.style.cssText = 'position:relative;';

    // Week grid lines
    let cur = new Date(START);
    while(cur <= END){
      const wl = document.createElement('div');
      wl.className = 'week-line';
      wl.style.left = (LABEL_W + pct(cur)/100*BAR_W)+'px';
      area.appendChild(wl);
      cur = new Date(cur.getTime() + 7*86400000);
    }

    // Today line
    const tl = document.createElement('div');
    tl.className = 'today-line';
    tl.style.left = (LABEL_W + pct(TODAY)/100*BAR_W)+'px';
    area.appendChild(tl);

    let lastSec = '', idx = 0;
    vis.forEach(t=>{
      if(t.section && t.section !== lastSec){
        lastSec = t.section;
        const sec = document.createElement('div');
        sec.className = 'section-label';
        sec.style.paddingLeft = LABEL_W+'px';
        sec.textContent = t.section;
        area.appendChild(sec);
      }

      const row = document.createElement('div');
      row.className = 'task-row';

      const lbl = document.createElement('div');
      lbl.className = 'task-label'+(t.sub?' sub':'');
      lbl.style.width = LABEL_W+'px';
      lbl.textContent = t.label;
      row.appendChild(lbl);

      const cell = document.createElement('div');
      cell.className = 'bar-cell';
      cell.style.cssText = `width:${BAR_W}px;position:relative;height:26px;`;

      if(t.milestone){
        const ms = document.createElement('div');
        ms.className = 'milestone';
        ms.style.left = (pct(t.start)/100*BAR_W - 7)+'px';
        ms.style.animationDelay = (idx*28+60)+'ms';
        ms.addEventListener('mouseenter', e=>showTooltip(e,t));
        ms.addEventListener('mousemove', placeTooltip);
        ms.addEventListener('mouseleave', hideTooltip);
        cell.appendChild(ms);
      } else {
        const p = pctSpan(t.start, t.end);
        const leftPx  = parseFloat(p.left)/100*BAR_W;
        const widthPx = parseFloat(p.width)/100*BAR_W;
        const bar = document.createElement('div');
        bar.className = 'bar '+t.color;
        bar.style.left  = leftPx+'px';
        bar.style.width = widthPx+'px';
        bar.style.animationDelay = (idx*25+60)+'ms';
        bar.addEventListener('mouseenter', e=>showTooltip(e,t));
        bar.addEventListener('mousemove', placeTooltip);
        bar.addEventListener('mouseleave', hideTooltip);

        const dot = document.createElement('span');
        dot.className = 'status-dot '+t.status;
        dot.style.cssText = 'display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;flex-shrink:0;';
        bar.appendChild(dot);

        if(widthPx > 50){
          bar.appendChild(document.createTextNode(
            t.label.length>14 ? t.label.substring(0,13)+'…' : t.label
          ));
        }
        cell.appendChild(bar);
      }
      row.appendChild(cell);
      area.appendChild(row);
      idx++;
    });

    wrap.appendChild(area);
    chart.appendChild(wrap);
    chart.style.opacity = '1';
    chart.style.transform = 'none';
  }

  if(animate){
    chart.style.transition = 'opacity 0.18s,transform 0.18s';
    chart.style.opacity = '0';
    chart.style.transform = 'translateY(5px)';
    setTimeout(build, 190);
  } else {
    build();
  }
}

document.getElementById('filters').addEventListener('click', e=>{
  if(!e.target.dataset.group) return;
  activeGroup = e.target.dataset.group;
  document.querySelectorAll('.filter-btn').forEach(b=>
    b.classList.toggle('active', b.dataset.group===activeGroup)
  );
  render(true);
});

render(false);
</script>
