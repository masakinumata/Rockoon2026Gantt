const GROUP_ORDER=['overall','ignition','attitude','separation','observation','camera','structure','avionics','simulation'];
const GROUP_JA={overall:'全体',ignition:'点火',attitude:'姿勢',separation:'分離',observation:'観測',camera:'カメラ',structure:'構造',avionics:'電装',simulation:'シミュレーション'};
const GROUP_COLOR={overall:'#7BBCED',ignition:'#EC9070',attitude:'#ABAAE9',separation:'#4DC9A8',observation:'#F5A823',camera:'#95C84A',structure:'#B8B5AA',avionics:'#EE93B5',simulation:'#F59E5C'};
const STATUS_LABEL={done:'完了',inprog:'進行中',todo:'未着手',delayed:'遅延'};
const PROGRESS={done:100,inprog:50,todo:0,delayed:30};
const PROG_COLOR={done:'#22c55e',inprog:'#f59e0b',todo:'#94a3b8',delayed:'#ef4444'};
function dayOf(d){return(new Date(d)-START)/86400000;}
function pct(d){return Math.max(0,Math.min(100,dayOf(d)/TOTAL_DAYS*100));}
function pctSpan(s,e){const sp=pct(s),ep=pct(e);return{left:sp+'%',width:Math.max(ep-sp,1.2)+'%'};}
function fmtDate(d){const dt=new Date(d);return(dt.getMonth()+1)+'/'+dt.getDate();}
const ttEl=document.getElementById('gc-tooltip');
let hideTimer;
function showTooltip(e,t){
  clearTimeout(hideTimer);
  const period=t.milestone?fmtDate(t.start):fmtDate(t.start)+' → '+fmtDate(t.end);
  const noteHtml=t.note?'<div class="tt-note">'+t.note+'</div>':'';
  const progHtml=t.milestone?'':'<div class="tt-progress"><div class="tt-progress-fill" style="width:'+PROGRESS[t.status]+'%;background:'+PROG_COLOR[t.status]+';"></div></div>';
  ttEl.innerHTML='<div class="tt-title">'+t.label+'</div><div class="tt-row"><strong>'+period+'</strong></div>'+noteHtml+'<div class="tt-footer"><span class="tt-status '+t.status+'">'+STATUS_LABEL[t.status]+'</span>'+progHtml+'</div>';
  placeTooltip(e);ttEl.classList.add('visible');
}
function placeTooltip(e){const vw=window.innerWidth,vh=window.innerHeight;ttEl.style.left=Math.min(e.clientX+16,vw-296)+'px';ttEl.style.top=Math.min(e.clientY-12,vh-140)+'px';}
function hideTooltip(){hideTimer=setTimeout(()=>ttEl.classList.remove('visible'),80);}
tasks.sort((a,b)=>{
  const ai=GROUP_ORDER.indexOf(a.group),bi=GROUP_ORDER.indexOf(b.group);
  const av=ai===-1?999:ai, bv=bi===-1?999:bi;
  if(av!==bv)return av-bv;
  return new Date(a.start)-new Date(b.start);
});
let activeGroup='all';
function render(animate){
  const vis=activeGroup==='all'?tasks:tasks.filter(t=>t.group===activeGroup);
  const chart=document.getElementById('chart');
  const COL_W=LABEL_W+BAR_W;
  function build(){
    chart.innerHTML='';
    const wrap=document.createElement('div');wrap.style.cssText='position:relative;width:'+COL_W+'px;';
    const hdr=document.createElement('div');hdr.style.cssText='display:flex;margin-bottom:6px;';
    const lbl0=document.createElement('div');lbl0.style.cssText='width:'+LABEL_W+'px;flex-shrink:0;';hdr.appendChild(lbl0);
    const mWrap=document.createElement('div');mWrap.style.cssText='width:'+BAR_W+'px;display:flex;';
    [['6月',new Date(2026,5,1),new Date(2026,6,1)],['7月',new Date(2026,6,1),new Date(2026,7,1)],['8月',new Date(2026,7,1),new Date(2026,8,30)]].forEach(([m,s,e])=>{
      const d=document.createElement('div');d.className='month-col';d.style.width=((e-s)/86400000/TOTAL_DAYS*100)+'%';d.textContent=m;mWrap.appendChild(d);
    });
    hdr.appendChild(mWrap);wrap.appendChild(hdr);
    const area=document.createElement('div');area.style.position='relative';
    let cur=new Date(START);
    while(cur<=END){const wl=document.createElement('div');wl.className='week-line';wl.style.left=(LABEL_W+pct(cur)/100*BAR_W)+'px';area.appendChild(wl);cur=new Date(cur.getTime()+7*86400000);}
    if(TODAY>=START&&TODAY<=END){const tl=document.createElement('div');tl.className='today-line';tl.style.left=(LABEL_W+pct(TODAY)/100*BAR_W)+'px';area.appendChild(tl);}
    let lastGroup='',idx=0;
    vis.forEach(t=>{
      if(t.group!==lastGroup){
        lastGroup=t.group;
        const sec=document.createElement('div');sec.className='section-label';sec.style.paddingLeft=LABEL_W+'px';
        const sdot=document.createElement('span');sdot.className='sec-dot';sdot.style.background=GROUP_COLOR[t.group]||'#cbd5e1';
        sec.appendChild(sdot);
        sec.appendChild(document.createTextNode(GROUP_JA[t.group]||t.group));
        area.appendChild(sec);
      }
      const row=document.createElement('div');row.className='task-row';
      const lbl=document.createElement('div');lbl.className='task-label'+(t.sub?' sub':'');lbl.style.width=LABEL_W+'px';lbl.textContent=t.label;row.appendChild(lbl);
      const cell=document.createElement('div');cell.className='bar-cell';cell.style.cssText='width:'+BAR_W+'px;position:relative;height:26px;';
      if(t.milestone){
        const ms=document.createElement('div');ms.className='milestone';ms.style.left=(pct(t.start)/100*BAR_W-7)+'px';ms.style.animationDelay=(idx*28+60)+'ms';
        ms.addEventListener('mouseenter',e=>showTooltip(e,t));ms.addEventListener('mousemove',placeTooltip);ms.addEventListener('mouseleave',hideTooltip);cell.appendChild(ms);
      }else{
        const p=pctSpan(t.start,t.end);
        const leftPx=parseFloat(p.left)/100*BAR_W,widthPx=parseFloat(p.width)/100*BAR_W;
        const bar=document.createElement('div');
        const colorClass=t.status==='delayed'?'delayed':t.color;
        bar.className='bar '+colorClass;bar.style.left=leftPx+'px';bar.style.width=widthPx+'px';bar.style.animationDelay=(idx*25+60)+'ms';
        bar.addEventListener('mouseenter',e=>showTooltip(e,t));bar.addEventListener('mousemove',placeTooltip);bar.addEventListener('mouseleave',hideTooltip);
        const dot=document.createElement('span');dot.className='status-dot '+t.status;dot.style.cssText='display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;flex-shrink:0;';bar.appendChild(dot);
        if(widthPx>50)bar.appendChild(document.createTextNode(t.label.length>14?t.label.substring(0,13)+'…':t.label));
        cell.appendChild(bar);
      }
      row.appendChild(cell);area.appendChild(row);idx++;
    });
    wrap.appendChild(area);chart.appendChild(wrap);
    chart.style.opacity='1';chart.style.transform='none';
  }
  if(animate){chart.style.transition='opacity 0.18s,transform 0.18s';chart.style.opacity='0';chart.style.transform='translateY(5px)';setTimeout(build,190);}
  else build();
}
document.getElementById('filters').addEventListener('click',e=>{
  if(!e.target.dataset.group)return;
  activeGroup=e.target.dataset.group;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.group===activeGroup));
  render(true);
});
render(false);
</script>
</body>
</html>
